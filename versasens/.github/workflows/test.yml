# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Test project
on: [ push ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.7.21"

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Copy DLLs to System32 (Windows)
      if: runner.os == 'Windows'
      run: |
        $dllPath = "${{ github.workspace }}\dlls\*"
        $destinationPath = "$env:SystemRoot\System32"
        Copy-Item -Path $dllPath -Destination $destinationPath -Force -Recurse
        if (Test-Path $destinationPath) {
          Write-Output "DLLs copied to $destinationPath"
        } else {
          Write-Error "Failed to copy DLLs to $destinationPath"
          exit 1
        }

    - name: Install libopus and Qt Dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y libopus0 libgles2 libegl1

    - name: Install libopus (macOS)
      if: runner.os == 'macOS'
      run: brew install opus

    - name: Check project with ruff
      run: uv run ruff check src --ignore FIX002

    - name: Install pytest GitHub plugin
      run: uv add --dev pytest-github-actions-annotate-failures

    - name: Test with pytest
      env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
      run: uv run pytest tests -m "not slow"